<!DOCTYPE html>
<html>
<head>
 
  <title>Student ID Card Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Student ID Card Generator</h1>

  <div class="container">

   
    <form id="idForm">
      <label for="college">College / University name</label>
      <input type="text" id="college" placeholder="e.g. Bosscoder School of Technology" required>

      <label for="name">Student name</label>
      <input type="text" id="name" required>

      <label for="enroll">Enrollment no</label>
      <input type="text" id="enroll" required>

      <label for="sid">Student ID</label>
      <input type="text" id="sid" required>

      <label for="guardian">Father / Guardian</label>
      <input type="text" id="guardian">

      <label for="course">Class / Course</label>
      <input type="text" id="course" required>

      <label for="phone">Emergency call</label>
      <input type="tel" id="phone" required>

      <label for="photo">Photo</label>
      <input type="file" id="photo" accept="image/*">

      <button type="submit">Generate card</button>
    </form>

    
    <div class="preview">
      <div class="card" id="card">
        <div class="card-top">
          <p id="cCollege">University Name</p>
        </div>

        <img id="cPhoto" src="" alt="">
        <div id="noPhoto" class="no-photo">No photo</div>

        <div class="card-details">
          <p><span>Enrollment No</span>: <b id="cEnroll">123456</b></p>
          <p><span>Student ID</span>: <b id="cId">1234</b></p>
          <p><span>Name</span>: <b id="cName">Name Here</b></p>
          <p><span>Guardian</span>: <b id="cGuardian">-</b></p>
          <p><span>Class</span>: <b id="cCourse">Course / Batch</b></p>
          <p><span>Emergency</span>: <b id="cPhone">123-456-7890</b></p>
        </div>
      </div>

      <button id="printBtn" type="button">Print / Save card</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
